# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: garage
git:
  tag_sort: -version:creatordate
report_sizes: true

before:
  hooks:
    - go mod tidy

builds:
  - id: garage
    main: ./cmd
    binary: garage
    env:
      - CGO_ENABLED=0
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w
      - -X "main.tag={{.Tag}}"
      - -X "main.buildDate={{.Date}}"
      - -X "main.gitCommit={{.FullCommit}}"
    goos:
      - linux
      - freebsd
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - id: garage
    ids: [garage]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - "LICENSE"
      - "CHANGELOG.md"

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
